<div class="pagination clearfix mb1 mt4">
  <!-- Botones Next y Previous -->
  <div class="left">
    {% if page.previous %}
      <a href="{{ page.previous.url }}" class="button">← Previous</a>
    {% endif %}
  </div>

  <div class="right">
    {% if page.next %}
      <a href="{{ page.next.url }}" class="button">Next →</a>
    {% endif %}
  </div>
</div>
