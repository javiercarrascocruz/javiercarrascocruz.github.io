<div class="jekyll-linkpreview-wrapper">
  <a href="{{ url }}" class="jekyll-linkpreview-wrapper-inner">
    <div class="jekyll-linkpreview-image">
      <img src="{{ image }}" alt="Preview image">
    </div>
    <h2 class="jekyll-linkpreview-title">
      <i class="fab fa-youtube jekyll-linkpreview-icon" aria-hidden="true"></i>
      <span>{{ title }}</span>
    </h2>
  </a>
</div>
