<div class="jekyll-linkpreview-wrapper">
  <a href="{{ url }}" class="jekyll-linkpreview-wrapper-inner" style="text-decoration: none; color: inherit;">
    <div class="jekyll-linkpreview-image">
      <img src="{{ image }}" alt="Preview image">
    </div>
    <h2 class="jekyll-linkpreview-title">{{ title }}</h2>
  </a>
</div>
